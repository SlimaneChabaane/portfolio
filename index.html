    <style>
        * { box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #080f1a; color: #94a3b8; }

        /* Grain overlay */
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            opacity: 0.4;
        }

        .orb { position: absolute; border-radius: 9999px; filter: blur(120px); pointer-events: none; z-index: 0; }

        /* Scroll reveal */
        .reveal { opacity: 0; transform: translateY(28px); transition: opacity .6s ease, transform .6s ease; }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        /* Timeline */
        .timeline-item { border-left: 2px solid #1e2f47; padding-left: 1.5rem; position: relative; }
        .timeline-item::before {
            content: ''; position: absolute; left: -5px; top: 6px;
            width: 8px; height: 8px; border-radius: 9999px;
            background: #2563eb; border: 2px solid #080f1a;
        }

        /* Tag */
        .tag {
            display: inline-block; padding: 3px 12px; font-size: .72rem; font-weight: 500;
            border-radius: 999px; border: 1px solid #1e2f47; color: #64748b;
            background: #0d1a2d; transition: border-color .2s, color .2s;
        }
        .tag:hover { border-color: #2563eb; color: #93c5fd; }

        /* Card */
        .card {
            background: #101c2e; border: 1px solid #1e2f47; border-radius: 16px;
            transition: border-color .3s, box-shadow .3s;
        }
        .card:hover { border-color: #2563eb40; box-shadow: 0 0 40px #2563eb15; }

        /* Email */
        .email-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: 10px;
            border: 1px dashed #2563eb80; background: #0d1a2d;
            color: #60a5fa; font-size: .85rem; font-weight: 500;
            cursor: pointer; transition: background .2s, border-color .2s;
        }
        .email-badge:hover { background: #1e2f47; border-color: #2563eb; }

        h2.section-title {
            font-family: 'Syne', sans-serif;
            font-size: 2rem; font-weight: 700; color: #f1f5f9; margin-bottom: 2.5rem;
        }

        /* Nav underline */
        nav a.nav-link { position: relative; padding-bottom: 2px; }
        nav a.nav-link::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 0; height: 1px; background: #2563eb; transition: width .25s ease;
        }
        nav a.nav-link:hover::after { width: 100%; }

        /* Lang switch */
        .lang-btn {
            padding: 4px 12px; border-radius: 8px; font-size: .8rem; font-weight: 600;
            transition: all .2s; cursor: pointer; border: 1px solid transparent;
        }
        .lang-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .lang-btn:not(.active) { color: #64748b; border-color: #1e2f47; }
        .lang-btn:not(.active):hover { color: #94a3b8; border-color: #2563eb40; }
    </style>
</head>

<!-- SCRIPTS                                             -->
<!-- ================================================== -->
<script>
    /* Scroll reveal */
    document.addEventListener('alpine:initialized', () => {
        setTimeout(() => {
            const io = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => io.observe(el));
        }, 100);
    });

    /* Sync <html lang=""> attribute with Alpine lang state */
    document.addEventListener('alpine:initialized', () => {
        const html = document.documentElement;
        const observer = new MutationObserver(() => {});
        // Watch lang changes via Alpine
        document.addEventListener('alpine:mutation', () => {});
        // Simpler: poll the body attribute Alpine sets
        setInterval(() => {
            const body = document.body;
            if (body._x_dataStack) {
                const data = body._x_dataStack[0];
                if (data && data.lang) html.setAttribute('lang', data.lang);
            }
        }, 300);
    });
</script>
